name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS
        run: dotnet workload install maui-ios

      - name: Restore packages
        run: dotnet restore

      - name: Build IPA
        run: |
          dotnet publish \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableAssemblyILStripping=false

      - name: Find and copy IPA
        run: |
          # Find the IPA
          IPA_FILE=$(find /Users/runner -name "*.ipa" -type f 2>/dev/null | head -1)
          
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find ~/Library -name "*.ipa" -type f 2>/dev/null | head -1)
          fi
          
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find ~/.net -name "*.ipa" -type f 2>/dev/null | head -1)
          fi
          
          echo "Found IPA: $IPA_FILE"
          
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            mkdir -p ./artifacts
            cp "$IPA_FILE" ./artifacts/BabyTracker.ipa
            echo "IPA copied to ./artifacts/BabyTracker.ipa"
            ls -la ./artifacts/
          else
            echo "ERROR: No IPA file found"
            echo "Listing .app bundles:"
            find /Users/runner -name "*.app" -type d 2>/dev/null | head -5
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker
          path: ./artifacts/*.ipa
          if-no-files-found: warn
          retention-days: 7
