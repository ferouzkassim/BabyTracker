name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install .NET 10
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH
      
      - name: Check .NET
        run: dotnet --version
      
      - name: Install MAUI
        run: dotnet workload install maui-ios
      
      - name: Restore
        run: dotnet restore
      
      - name: Build
        run: dotnet build -f net10.0-ios -c Release
      
      - name: Publish
        run: dotnet publish -f net10.0-ios -c Release -r ios-arm64 --no-build
      
      - name: Find App
        run: |
          echo "=== Finding .app bundle ==="
          find $HOME/.net -name "*.app" -type d 2>/dev/null | head -10
      
      - name: Create IPA
        run: |
          APP=$(find $HOME/.net -name "BabyTracker.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "BabyTracker.app not found"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r BabyTracker.ipa Payload
          rm -rf Payload
          ls -la BabyTracker.ipa
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker
          path: BabyTracker.ipa
          if-no-files-found: error
